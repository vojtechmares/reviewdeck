[package]
name = "reviewdeck"
description = "Aggregate code review requests across every Git host you work with."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "reviewdeck"
path = "src/main.rs"

[features]
default = []
# Opt-in fallback for machines without Xcode's Metal toolchain: compile gpui's
# shaders at launch instead of at build time. Off by default, because shipping
# them precompiled is what keeps startup fast.
runtime-shaders = ["gpui/runtime_shaders"]

[dev-dependencies]
# `#[gpui::test]` and TestAppContext, which drive the engine without a window.
gpui = { workspace = true, features = ["font-kit", "test-support"] }
# JSON bodies for the mock host in the view tests.
serde_json.workspace = true

[dependencies]
# `font-kit` is gpui's macOS text system (CoreText). Without it gpui falls back to
# a no-op text system and draws no text at all.
gpui = { workspace = true, features = ["font-kit"] }
reviewdeck-core.workspace = true
# AppKit glue for src/platform: the menu bar item, notifications, launch at login
# and the appearance. All of them are already in gpui's dependency tree.
block.workspace = true
cocoa.workspace = true
futures.workspace = true
objc.workspace = true
raw-window-handle.workspace = true
