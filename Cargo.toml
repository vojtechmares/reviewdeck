[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Vojtěch Mareš <vojtech@mares.cz>"]
license = "MIT"
publish = false

# The pin list. Every version below is the one gpui 0.2.2 already resolves, so
# reusing a crate costs nothing to compile; the features match what gpui turns on
# for the same reason (a crate built with two feature sets is built twice).
# Crates declare only what they use, with `workspace = true`.
[workspace.dependencies]
reviewdeck-core = { path = "crates/core" }

gpui = { version = "=0.2.2", default-features = false }

serde = { version = "1.0.229", features = ["derive"] }
# preserve_order + raw_value are what gpui enables; matching them keeps one build
# of serde_json, and preserve_order keeps object keys in insertion order the way
# JavaScript objects do.
serde_json = { version = "1.0.151", features = ["preserve_order", "raw_value"] }
url = "2.5.8"
regex = "1.13.1"
anyhow = "1.0.104"
futures = "0.3.34"
parking_lot = "0.12.5"
uuid = { version = "1.27.0", features = ["v4"] }
base64 = "0.22.1"
log = "0.4.34"
libc = "0.2.190"
# Zed's fork of reqwest, with exactly the features gpui_http_client enables.
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "multipart",
    "rustls-tls-native-roots",
    "socks",
    "stream",
] }
tokio = { version = "1.53.2", default-features = false, features = ["rt", "time"] }

# macOS glue.
security-framework = "3.7.0"
objc = "0.2.7"
cocoa = "=0.26.0"
block = "0.1.6"
core-foundation = "=0.10.0"

# The only genuinely new crates: markdown and syntax highlighting.
pulldown-cmark = { version = "0.13.4", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-onig", "dump-load"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# gpui is unusably slow unoptimised; our own crates stay at opt-level 0 for fast
# rebuilds.
[profile.dev.package."*"]
opt-level = 1
