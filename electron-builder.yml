appId: cz.mares.reviewdeck
productName: Reviewdeck
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  # Pinned to the self-signed release certificate, so a build never picks up
  # whatever else is in the keychain - a maintainer machine also carries an
  # Apple Development certificate, which is not what ships. The public half is
  # resources/reviewdeck-self-signed.pem; the private key reaches CI through
  # the CSC_LINK secret. A machine without it - a fork's CI, a contributor's
  # laptop - cannot make this signature, so scripts/signing-identity.sh hands
  # electron-builder "-" instead and the build comes out ad-hoc.
  identity: "Reviewdeck Self-Signed"
  target:
    # The dmg is what a human downloads; the zip is what the Homebrew cask
    # installs, so brew does not have to mount a disk image.
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
