# Temporary diagnostic for HOMEBREW_TAP_TOKEN. Delete once the tap bump works.
name: Tap token check

on: workflow_dispatch

permissions: {}

jobs:
  check:
    name: Probe the tap token
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Probe
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: vojtechmares/homebrew-tap
        run: |
          set -uo pipefail

          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN is empty"
            exit 1
          fi

          # Shape only - the value itself is never printed, and Actions masks
          # it anyway. Lengths and prefixes are public knowledge per token type.
          LEN=${#TAP_TOKEN}
          echo "length: $LEN"
          case "$TAP_TOKEN" in
            github_pat_*) echo "kind:   fine-grained PAT" ;;
            ghp_*)        echo "kind:   classic PAT" ;;
            gho_* | ghs_* | ghu_*) echo "kind:   OAuth / app / installation token" ;;
            *)            echo "kind:   unrecognised prefix" ;;
          esac
          STRIPPED="$(printf '%s' "$TAP_TOKEN" | tr -d '[:space:]')"
          if [[ ${#STRIPPED} -ne $LEN ]]; then
            echo "::warning::secret carries $((LEN - ${#STRIPPED})) whitespace character(s) - that alone breaks the auth header"
          else
            echo "spaces: none"
          fi

          probe() {
            curl -sS -o /tmp/body -w '%{http_code}' \
              -H "Authorization: Bearer $TAP_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/$1"
          }

          echo
          echo "== GET /user =="
          CODE="$(probe user)"
          echo "http $CODE"
          if [[ "$CODE" == 200 ]]; then
            jq -r '"authenticated as \(.login)"' /tmp/body
          else
            jq -r '.message // "no message"' /tmp/body
          fi

          echo
          echo "== GET /repos/$TAP_REPO =="
          CODE="$(probe "repos/$TAP_REPO")"
          echo "http $CODE"
          if [[ "$CODE" == 200 ]]; then
            # A token with no grant on the tap still reads it - it is public -
            # but reports push:false. That is the tell.
            jq -c '.permissions' /tmp/body
          else
            jq -r '.message // "no message"' /tmp/body
          fi
