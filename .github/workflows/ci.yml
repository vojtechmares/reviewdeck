name: CI

on:
  push:
    branches: ["**"]
  # Not on tags: the release workflow runs the same tests and the same build,
  # and a macOS runner doing it twice for one push is money for nothing.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 20
    env:
      # electron-builder refuses to sign on pull requests unless this is set,
      # and an unsigned arm64 bundle will not launch at all. A pull request
      # from a fork cannot reach the certificate and signs ad-hoc regardless;
      # the flag is what lets a branch in this repository sign for real.
      CSC_FOR_PULL_REQUEST: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # The Electron binary is ~100 MB and is fetched twice - once by the
      # postinstall hook, once by electron-builder for the target arch.
      - name: Cache the Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck and build
        run: pnpm build

      # A branch in this repository signs with the release certificate, so the
      # path a tag depends on is exercised before the tag exists. A fork reads
      # empty secrets, imports nothing, and falls back to ad-hoc.
      - name: Import the signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: ./scripts/import-signing-cert.sh

      # --dir only, so every push exercises packaging and signing without
      # paying for the dmg. The release workflow builds the real artifacts.
      - name: Package the app
        run: |
          pnpm exec electron-builder --mac --dir --config electron-builder.yml \
            -c.mac.identity="$(./scripts/signing-identity.sh)"

      # Ad-hoc is the expected outcome on a fork and a failure anywhere else,
      # so the assertion follows whether the secret was readable.
      - name: Verify the bundle
        env:
          REQUIRE_SIGNED_IDENTITY: ${{ secrets.CSC_LINK != '' && '1' || '' }}
        run: ./scripts/verify-app.sh release/mac-arm64/Reviewdeck.app

      - name: Zip the app
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            release/mac-arm64/Reviewdeck.app "release/Reviewdeck-${GITHUB_SHA::7}.zip"

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: Reviewdeck-${{ github.sha }}
          path: release/*.zip
          if-no-files-found: error

      # Bounded: cleanup is tidying, and macOS has more than one way to sit
      # waiting for an authorisation dialog that will never be answered.
      - name: Remove the signing certificate
        if: always()
        timeout-minutes: 2
        run: ./scripts/import-signing-cert.sh --remove
