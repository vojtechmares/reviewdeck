name: CI

on:
  push:
    branches: ["**"]
  # Not on tags: the release workflow runs the same tests and the same build,
  # and a macOS runner doing it twice for one push is money for nothing.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts only help a rebuild on the same machine; on a runner
  # they are dead weight in the cache.
  CARGO_INCREMENTAL: 0

jobs:
  build-test:
    name: Build and test
    runs-on: macos-26
    # gpui from a cold cache is most of this; a warm one is a few minutes.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-apple-darwin

      # gpui compiles its Metal shaders at build time, and from Xcode 26 on the
      # Metal compiler is a separate download. It is not cached: it is a
      # system component that only Xcode can install, and fetching it from
      # Apple's CDN costs about what restoring it from the cache would.
      - name: Install the Metal toolchain
        run: |
          set -euo pipefail
          if xcrun metal --version >/dev/null 2>&1; then
            echo "Metal toolchain already installed"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      # gpui and its dependencies are most of the build. The key changes with
      # the lockfile and the compiler, either of which invalidates the target
      # directory anyway.
      - name: Cache the cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # --dir-only, so every push exercises the release build, the bundle and
      # the signature without paying for the dmg. The release workflow builds
      # the real artifacts.
      - name: Package the app
        run: ./scripts/bundle.sh --dir-only

      - name: Verify the bundle
        run: ./scripts/verify-app.sh release/mac-arm64/Reviewdeck.app

      - name: Zip the app
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            release/mac-arm64/Reviewdeck.app "release/Reviewdeck-${GITHUB_SHA::7}.zip"

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: Reviewdeck-${{ github.sha }}
          path: release/*.zip
          if-no-files-found: error
