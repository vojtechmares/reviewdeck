name: CI

on:
  # main, and pull requests into it: a branch is checked through its pull
  # request, so one push does not run the macOS job twice. Not on tags either:
  # the release workflow runs the same tests and the same build.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The build cache's key hashes every CARGO* and RUST* variable, so these must
# match release.yml's for a tag to find main's cache.
env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts only help a rebuild on the same machine; on a runner
  # they are dead weight in the cache.
  CARGO_INCREMENTAL: 0

jobs:
  build-test:
    name: Build and test
    runs-on: macos-26
    # gpui from a cold cache is most of this; a warm one is a few minutes.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # The version, components and target come from rust-toolchain.toml, which
      # rustup reads from 1.28 on. Every other toolchain is removed: the build
      # cache's key covers all installed toolchains, so the image's own stable
      # would otherwise turn the cache cold whenever GitHub updates the image.
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          rustup --version
          rustup toolchain install
          ACTIVE="$(rustup show active-toolchain | cut -d' ' -f1)"
          for TOOLCHAIN in $(rustup toolchain list --quiet); do
            if [[ "$TOOLCHAIN" != "$ACTIVE" ]]; then
              rustup toolchain uninstall "$TOOLCHAIN"
            fi
          done
          rustup toolchain list
          rustc --version

      # gpui compiles its Metal shaders at build time, and from Xcode 26 on the
      # Metal compiler is a separate download. It is not cached: it is a
      # system component that only Xcode can install, and fetching it from
      # Apple's CDN costs about what restoring it from the cache would.
      - name: Install the Metal toolchain
        run: |
          set -euo pipefail
          if xcrun metal --version >/dev/null 2>&1; then
            echo "Metal toolchain already installed"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      # gpui and its dependencies are most of the build. The cache holds only
      # them (not the workspace's own crates, which change with every commit),
      # pruned of anything the build no longer uses before it is saved, and is
      # keyed on the compiler, the manifests and the lockfile.
      #
      # Only main saves it. Pull requests and release tags restore main's cache
      # and never write their own, so there is one bounded entry rather than a
      # copy per branch evicting each other from the 10 GB repository limit.
      - name: Cache the cargo registry and dependency builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Shared with release.yml; without it the key includes the job id.
          shared-key: macos-arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # --dir-only, so every push exercises the release build, the bundle and
      # the signature without paying for the dmg. The release workflow builds
      # the real artifacts.
      - name: Package the app
        run: ./scripts/bundle.sh --dir-only

      - name: Verify the bundle
        run: ./scripts/verify-app.sh release/mac-arm64/Reviewdeck.app

      - name: Zip the app
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            release/mac-arm64/Reviewdeck.app "release/Reviewdeck-${GITHUB_SHA::7}.zip"

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: Reviewdeck-${{ github.sha }}
          path: release/*.zip
          if-no-files-found: error
